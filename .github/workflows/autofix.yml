---
name: autofix.ci

on:
  pull_request: {}
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: 0.12.19
          python-version: '3.13'
      - name: Run repository fixers and checks
        run: uv run --locked prek run --all-files --stage pre-commit --no-fail-fast
      - uses: autofix-ci/action@v1.3.4
        if: always()
