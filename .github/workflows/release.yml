---
name: Release

on:
  push:
    tags: [20*]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: 0.12.19
          python-version: '3.13'
      - run: uv run --locked pytest
      - run: uv run --locked prek run --all-files
      - run: uv run --locked prek run --all-files --stage pre-push
      - run: uv run --locked sphinx-build -W -b html docs/source docs/build/html
      - run: uv build
      - run: uv run --locked twine check dist/*
      - run: uv run --locked check-wheel-contents dist/*.whl
      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/*
  binaries:
    # actionlint 1.7.12 accepts ./ for local workflows and rejects $/.
    uses: ./.github/workflows/binaries.yml  # zizmor: ignore[self-repository]
    with:
      notarize: true
    secrets:
      DEVELOPER_ID_APP_CERT_P12_BASE64: ${{ secrets.DEVELOPER_ID_APP_CERT_P12_BASE64 }}
      DEVELOPER_ID_APP_CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_APP_CERT_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
  publish:
    needs: [validate, binaries]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Attach distributions and binaries
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" artifacts/distributions/* artifacts/hackerrank-*/*
          --title "$TAG" --notes-file CHANGELOG.rst --verify-tag
  docker:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/adamtheturtle/hackerrank-cli:${{ github.ref_name }},ghcr.io/adamtheturtle/hackerrank-cli:latest
          build-args: HACKERRANK_CLI_VERSION=${{ github.ref_name }}
