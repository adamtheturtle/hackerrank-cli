name: Documentation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.12.19'
          python-version: '3.13'
      - run: uv run --locked sphinx-build -W --keep-going -b html docs/source docs/build/html
      - run: uv run --locked towncrier build --draft --version unreleased
      - uses: actions/upload-artifact@v7
        with:
          name: documentation
          path: docs/build/html
