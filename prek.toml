# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

fail_fast = true
default_install_hook_types = [
  "pre-commit",
  "pre-push"
  ]

[[repos]]
repo = "meta"
hooks = [
  {
    id = "check-useless-excludes",
    priority = 10,
    stages = ["pre-commit"],
    groups = ["fast"]
  }
]

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [
  {
    id = "check-added-large-files",
    priority = 30,
    stages = ["pre-commit"],
    groups = ["fast"]
  },
  {
    id = "check-case-conflict",
    priority = 40,
    stages = ["pre-commit"],
    groups = ["fast"]
  },
  {
    id = "check-executables-have-shebangs",
    priority = 60,
    stages = ["pre-commit"],
    groups = ["fast"]
  },
  {
    id = "check-merge-conflict",
    priority = 20,
    stages = ["pre-commit"],
    groups = ["fast"]
  },
  {
    id = "check-shebang-scripts-are-executable",
    priority = 70,
    stages = ["pre-commit"],
    groups = ["fast"]
  },
  {
    id = "check-symlinks",
    priority = 50,
    stages = ["pre-commit"],
    groups = ["fast"]
  },
  {
    id = "check-json",
    priority = 90,
    stages = ["pre-commit"],
    groups = ["fast"]
  },
  {
    id = "check-toml",

    priority = 91,
    stages = ["pre-commit"],
    groups = ["fast"]
  },
  {
    id = "check-vcs-permalinks",
    priority = 80,
    stages = ["pre-commit"],
    groups = ["fast"]
  },
  {
    id = "check-yaml",

    priority = 92,
    stages = ["pre-commit"],
    groups = ["fast"]
  },
  {
    id = "end-of-file-fixer",
    priority = 100,
    stages = ["pre-commit"],
    groups = ["fast"]
  },
  {
    id = "file-contents-sorter",
    files = 'spelling_private_dict\.txt$',
    priority = 110,
    stages = ["pre-commit"],
    groups = ["fast"]
  },
  {
    id = "trailing-whitespace",
    priority = 120,
    stages = ["pre-commit"],
    groups = ["fast"]
  }
]

[[repos]]
repo = "https://github.com/pre-commit/pygrep-hooks"
rev = "v1.10.0"
hooks = [
  {
    id = "rst-directive-colons",
    priority = 410,
    stages = ["pre-commit"],
    groups = ["fast"]
  },
  {
    id = "rst-inline-touching-normal",
    priority = 420,
    stages = ["pre-commit"],
    groups = ["fast"]
  },
  {
    id = "text-unicode-replacement-char",
    priority = 430,
    stages = ["pre-commit"],
    groups = ["fast"]
  },
  {
    id = "rst-backticks",
    priority = 440,
    stages = ["pre-commit"],
    groups = ["fast"]
  }
]

[[repos]]
repo = "local"
hooks = [
  {
    id = "actionlint",
    name = "actionlint",
    entry = "uv run --locked --group=dev actionlint",
    language = "system",
    pass_filenames = false,
    types_or = ["yaml"],

    priority = 500,
    stages = ["pre-commit"],
    groups = ["fast"]
  },
  {
    id = "shellcheck",
    name = "shellcheck",
    entry = "uv run --locked --group=dev shellcheck --shell=bash",
    language = "system",
    types_or = ["shell"],


    priority = 500,
    stages = ["pre-commit"],
    groups = ["fast"]
  },
  {
    id = "shellcheck-docs",
    name = "shellcheck-docs",
    entry = "uv run --locked --group=dev doccmd --no-write-to-file --example-workers 0 --language=shell --language=console --command=\"shellcheck --shell=bash\"",
    language = "system",
    types_or = [
      "markdown",
      "rst"
    ],

    priority = 500,
    stages = ["pre-commit"],
    groups = ["fast"]
  },
  {
    id = "shfmt",
    name = "shfmt",
    entry = "uv run --locked --group=dev shfmt --write --space-redirects --indent=4",
    language = "system",
    types_or = ["shell"],


    priority = 130,
    stages = ["pre-commit"],
    groups = ["fast"]
  },
  {
    id = "shfmt-docs",
    name = "shfmt-docs",
    entry = "uv run --locked --group=dev doccmd --language=shell --language=console --skip-marker=shfmt --no-pad-file --command=\"shfmt --write --space-redirects --indent=4\"",
    language = "system",
    types_or = [
      "markdown",
      "rst"
    ],

    priority = 140,
    stages = ["pre-commit"],
    groups = ["fast"]
  },
  {
    id = "pydocstringformatter",
    name = "pydocstringformatter",
    entry = "uv run --locked --group=dev pydocstringformatter",
    language = "system",
    types_or = ["python"],


    priority = 150,
    stages = ["pre-commit"],
    groups = ["fast"]
  },
  {
    id = "mypy",
    name = "mypy",
    stages = ["pre-push"],
    groups = ["typecheck"],
    priority = 520,
    entry = "uv run --locked --group=dev -m mypy --num-workers=auto",
    language = "system",
    types_or = [
      "python",
      "toml"
    ],
    pass_filenames = false

  },
  {
    id = "mypy-docs",
    name = "mypy-docs",
    stages = ["pre-push"],
    groups = ["typecheck"],
    priority = 540,
    entry = "uv run --locked --group=dev doccmd --no-write-to-file --language=python --command=\"mypy\"",
    language = "system",
    require_serial = true,
    types_or = [
      "markdown",
      "rst"
    ]

  },
  {
    id = "check-manifest",
    name = "check-manifest",
    stages = ["pre-push"],
    groups = ["fast"],
    priority = 520,
    entry = "uv run --locked --group=dev -m check_manifest --no-build-isolation",
    language = "system",
    pass_filenames = false

  },
  {
    id = "pyright",
    name = "pyright",
    stages = ["pre-push"],
    groups = ["typecheck"],
    priority = 520,
    entry = "uv run --locked --group=dev -m pyright .",
    language = "system",
    types_or = [
      "python",
      "toml"
    ],
    pass_filenames = false

  },
  {
    id = "pyright-docs",
    name = "pyright-docs",
    stages = ["pre-push"],
    groups = ["typecheck"],
    priority = 540,
    entry = "uv run --locked --group=dev doccmd --no-write-to-file --example-workers 0 --language=python --command=\"pyright\"",
    language = "system",
    types_or = [
      "markdown",
      "rst"
    ]

  },
  {
    id = "pyright-verifytypes",
    name = "pyright-verifytypes",
    stages = ["pre-push"],
    groups = ["typecheck"],
    priority = 530,
    entry = "uv run --locked --group=dev -m pyright --ignoreexternal --verifytypes hackerrank_cli",
    language = "system",
    pass_filenames = false,
    types_or = ["python"]

  },
  {
    id = "ty",
    name = "ty",
    stages = ["pre-push"],
    groups = ["typecheck"],
    priority = 520,
    entry = "uv run --locked --group=dev ty check",
    language = "system",
    types_or = [
      "python",
      "toml"
    ],
    pass_filenames = false

  },
  {
    id = "ty-docs",
    name = "ty-docs",
    stages = ["pre-push"],
    groups = ["typecheck"],
    priority = 540,
    entry = "uv run --locked --group=dev doccmd --no-write-to-file --example-workers 0 --language=python --command=\"ty check\"",
    language = "system",
    types_or = [
      "markdown",
      "rst"
    ]

  },
  {
    id = "pyrefly",
    name = "pyrefly",
    stages = ["pre-push"],
    groups = ["typecheck"],
    priority = 520,
    entry = "uv run --locked --group=dev pyrefly check",
    language = "system",
    types_or = [
      "python",
      "toml"
    ],
    pass_filenames = false

  },
  {
    id = "pyrefly-docs",
    name = "pyrefly-docs",
    stages = ["pre-push"],
    groups = ["typecheck"],
    priority = 540,
    entry = "uv run --locked --group=dev doccmd --no-write-to-file --example-workers 0 --language=python --command=\"pyrefly check\"",
    language = "system",
    types_or = [
      "markdown",
      "rst"
    ]

  },
  {
    id = "vulture",
    name = "vulture",
    entry = "uv run --locked --group=dev -m vulture .",
    language = "system",
    types_or = ["python"],
    pass_filenames = false,

    priority = 510,
    stages = ["pre-commit"],
    groups = ["fast"]
  },
  {
    id = "vulture-docs",
    name = "vulture docs",
    entry = "uv run --locked --group=dev doccmd --no-write-to-file --example-workers 0 --language=python --command=\"vulture\"",
    language = "system",
    types_or = [
      "markdown",
      "rst"
    ],

    priority = 510,
    stages = ["pre-commit"],
    groups = ["fast"]
  },
  {
    id = "pyroma",
    name = "pyroma",
    entry = "uv run --locked --group=dev -m pyroma --min 10 .",
    language = "system",
    pass_filenames = false,
    types_or = ["toml"],

    priority = 510,
    stages = ["pre-commit"],
    groups = ["fast"]
  },
  {
    id = "deptry",
    name = "deptry",
    entry = "uv run --locked --group=dev -m deptry src/",
    language = "system",
    pass_filenames = false,

    priority = 510,
    stages = ["pre-commit"],
    groups = ["fast"]
  },
  {
    id = "pylint",
    name = "pylint",
    entry = "uv run --locked pylint bin/ src/ tests/ docs/",
    language = "system",
    stages = ["manual"],
    groups = ["pylint"],
    priority = 600,
    pass_filenames = false

  },
  {
    id = "pylint-docs",
    name = "pylint-docs",
    entry = "uv run --locked --group=dev doccmd --no-write-to-file --example-workers 0 --language=python --command=\"pylint\"",
    language = "system",
    stages = ["manual"],
    groups = ["pylint"],
    priority = 605,
    types_or = [
      "markdown",
      "rst"
    ]

  },
  {
    id = "ruff-check-fix",
    name = "Ruff check fix",
    entry = "uv run --locked --group=dev -m ruff check --fix",
    language = "system",
    types_or = ["python"],


    priority = 160,
    stages = ["pre-commit"],
    groups = ["fast"]
  },
  {
    id = "ruff-check-fix-docs",
    name = "Ruff check fix docs",
    entry = "uv run --locked --group=dev doccmd --language=python --command=\"ruff check --fix\"",
    language = "system",
    types_or = [
      "markdown",
      "rst"
    ],

    priority = 170,
    stages = ["pre-commit"],
    groups = ["fast"]
  },
  {
    id = "ruff-format-fix",
    name = "Ruff format",
    entry = "uv run --locked --group=dev -m ruff format",
    language = "system",
    types_or = ["python"],


    priority = 180,
    stages = ["pre-commit"],
    groups = ["fast"]
  },
  {
    id = "ruff-format-fix-docs",
    name = "Ruff format docs",
    entry = "uv run --locked --group=dev doccmd --language=python --no-pad-file --command=\"ruff format\"",
    language = "system",
    types_or = [
      "markdown",
      "rst"
    ],

    priority = 190,
    stages = ["pre-commit"],
    groups = ["fast"]
  },
  {
    id = "strict-kwargs-fix",
    name = "strict-kwargs",
    entry = "uv run --locked --group=dev strict-kwargs check --fix",
    language = "system",
    types_or = ["python"],

    stages = ["pre-commit"],
    groups = ["fast"],
    require_serial = true
  },
  {
    id = "no-defaults",
    name = "no-defaults",
    entry = "uv run --locked --group=dev no-defaults",
    language = "system",
    types_or = ["python"],

    stages = ["pre-commit"],
    groups = ["fast"],
    require_serial = true
  },
  {
    id = "vale-sync",
    name = "vale sync",
    # The Python Vale wrapper may fail transiently while downloading its binary; see
    # https://github.com/daniperez/vale-python-package/issues/77
    entry = "uv run --locked --group=dev vale sync",
    language = "system",
    pass_filenames = false,
    files = '(\.(rst|md)$|^\.vale\.ini$)',

    stages = ["pre-commit"],
    groups = ["fast"]
  },
  {
    id = "snapper",
    name = "snapper",
    entry = "uv run --locked --group=dev snapper --native --max-width 79 --in-place",
    language = "system",
    types_or = [
      "rst",
      "markdown"
    ],
    require_serial = true,

    stages = ["pre-commit"],
  groups = ["fast"]},
  {
    id = "vale",
    name = "vale",
    entry = "uv run --locked --group=dev vale",
    language = "system",
    types_or = [
      "rst",
      "markdown"
    ],
    require_serial = true,

    stages = ["pre-commit"],
    groups = ["fast"]
  },
  {
    id = "doc8",
    name = "doc8",
    entry = "uv run --locked --group=dev -m doc8",
    language = "system",
    types_or = ["rst"],

    priority = 500,
    stages = ["pre-commit"],
    groups = ["fast"]
  },
  {
    id = "interrogate",
    name = "interrogate",
    entry = "uv run --locked --group=dev -m interrogate",
    language = "system",
    types_or = ["python"],


    priority = 510,
    stages = ["pre-commit"],
    groups = ["fast"]
  },
  {
    id = "interrogate-docs",
    name = "interrogate docs",
    entry = "uv run --locked --group=dev doccmd --no-write-to-file --example-workers 0 --language=python --command=\"interrogate\"",
    language = "system",
    types_or = [
      "markdown",
      "rst"
    ],

    priority = 510,
    stages = ["pre-commit"],
    groups = ["fast"]
  },
  {
    id = "pyproject-fmt-fix",
    name = "pyproject-fmt",
    entry = "uv run --locked --group=dev pyproject-fmt",
    language = "system",
    types_or = ["toml"],
    files = "pyproject.toml",

    priority = 200,
    stages = ["pre-commit"],
    groups = ["fast"]
  },
  {
    id = "linkcheck",
    name = "linkcheck",
    entry = "uv run --locked --group=dev sphinx-build -M linkcheck docs/source docs/build -W --keep-going -d docs/build/.doctrees-linkcheck",
    language = "system",
    types_or = ["rst"],
    stages = ["manual"],
    groups = ["docs"],
    priority = 610,
    pass_filenames = false

  },
  {
    id = "spelling",
    name = "spelling",
    entry = "uv run --locked --group=dev sphinx-build -M spelling docs/source docs/build -W -d docs/build/.doctrees-spelling",
    language = "system",
    types_or = ["rst"],
    stages = ["manual"],
    groups = ["docs"],
    priority = 610,
    pass_filenames = false

  },
  {
    id = "docs",
    name = "Build Documentation",
    entry = "uv run --locked --group=dev sphinx-build -M html docs/source docs/build -W -d docs/build/.doctrees-html",
    language = "system",
    stages = ["manual"],
    groups = ["docs"],
    priority = 610,
    pass_filenames = false

  },
  {
    id = "yamlfix",
    name = "yamlfix",
    entry = "uv run --locked --group=dev yamlfix",
    language = "system",
    types_or = ["yaml"],


    priority = 210,
    stages = ["pre-commit"],
    groups = ["fast"]
  },
  {
    id = "zizmor",
    name = "zizmor",
    entry = "uv run --locked --group=dev zizmor --strict-collection .github",
    language = "system",
    pass_filenames = false,
    types_or = ["yaml"],

    priority = 500,
    stages = ["pre-commit"],
    groups = ["fast"]
  },
  {
    id = "sphinx-lint",
    name = "sphinx-lint",
    entry = "uv run --locked --group=dev sphinx-lint --enable=all",
    language = "system",
    types_or = ["rst"],

    priority = 500,
    stages = ["pre-commit"],
    groups = ["fast"]
  }
]

[[repos]]
repo = "local"
hooks = [
  {
    id = "uv-lock",
    name = "uv lock",
    entry = "uv lock --locked",
    language = "system",
    pass_filenames = false,
    files = '(^pyproject\.toml$|^uv\.lock$)',
    priority = 95,
    stages = ["pre-commit"],
    groups = ["fast"]
  }
]
